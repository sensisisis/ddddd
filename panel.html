<head>

<title>Auxilio AimBot SensiAura</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--red:#ff171d;--red2:#ff3036}
html,body{width:100%;min-height:100%;margin:0;padding:0;background:#030303;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow-x:hidden;overflow-y:auto;user-select:none}
button,input{font:inherit}button{border:0;outline:none;cursor:pointer}button:active{transform:scale(.97)}
.app{position:relative;width:100%;min-height:100vh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 45%,rgba(120,0,0,.35),transparent 42%),radial-gradient(circle at 50% 75%,rgba(90,0,0,.22),transparent 35%),#020202}
.app:before{content:"";position:absolute;inset:0;z-index:-3;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.72))}
.app:after{content:"";position:absolute;width:420px;height:420px;left:50%;top:45%;transform:translate(-50%,-50%);z-index:-4;pointer-events:none;background:rgba(255,0,20,.08);filter:blur(100px);border-radius:50%}
.particles{position:absolute;inset:0;z-index:-1;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#ff1c24;box-shadow:0 0 7px 1px rgba(255,0,17,.75);animation:particleFloat 5s ease-in-out infinite alternate}
@keyframes particleFloat{0%{transform:translate3d(0,0,0);opacity:.18}50%{opacity:.65}100%{transform:translate3d(8px,-15px,0);opacity:1}}
.content{position:relative;z-index:2;width:min(100% - 34px,560px);margin:0 auto;padding-top:clamp(45px,9vh,105px);padding-bottom:45px}
.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:30px}
.logo{width:48px;height:48px;margin-bottom:12px;color:var(--red);filter:drop-shadow(0 0 5px rgba(255,0,20,.7)) drop-shadow(0 0 16px rgba(255,0,20,.35))}
.brand h1{margin:0;color:var(--red);font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:clamp(27px,7vw,36px);font-weight:900;letter-spacing:.3px;text-align:center;text-shadow:0 0 7px rgba(255,0,17,.8),0 0 22px rgba(255,0,17,.3)}
.brand span{margin-top:7px;color:rgba(255,255,255,.38);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.panel{width:100%;padding:26px 24px 25px;border:1px solid rgba(255,30,38,.38);border-radius:28px;background:linear-gradient(145deg,rgba(46,28,31,.92),rgba(15,9,11,.96));box-shadow:0 0 25px rgba(255,0,0,.25),0 25px 60px rgba(120,0,0,.25),inset 0 1px rgba(255,100,100,.13);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.power{width:100%;min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:14px 17px;color:#ff4248;border-radius:20px;background:linear-gradient(145deg,#111114,#0b0b0d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);transition:.2s ease}
.power.on{color:var(--red);background:linear-gradient(145deg,rgba(60,10,13,.95),rgba(18,8,10,.98));box-shadow:inset 0 0 0 1px rgba(255,25,32,.35),0 0 18px rgba(255,0,0,.12)}
.power-text{display:flex;flex-direction:column;gap:4px;text-align:left}.power-text strong{font-size:17px;font-weight:800}.power-text small{min-height:12px;color:#858585;font-size:10px;font-weight:600}
.switch{position:relative;display:flex;align-items:center;width:68px;height:36px;padding:3px;border-radius:999px;background:#303136;transition:.2s ease}.thumb{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.55);transition:transform .22s cubic-bezier(.23,1,.32,1)}.power.on .switch{background:#a8141b}.power.on .thumb{transform:translateX(32px);background:#ffe8e9;box-shadow:0 0 10px rgba(255,35,40,.3)}
.actions{display:grid;gap:13px;margin-top:24px}.action{position:relative;width:100%;min-height:64px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:18px;color:#fff;background:linear-gradient(110deg,#f30d15,#ff2b32);font-size:17px;font-weight:800;box-shadow:0 8px 18px rgba(255,0,7,.18),inset 0 1px rgba(255,255,255,.18);transition:filter .2s,box-shadow .2s,transform .16s}.action:hover{filter:brightness(1.08);box-shadow:0 11px 25px rgba(255,0,7,.3),inset 0 1px rgba(255,255,255,.2)}.action.secondary{background:linear-gradient(110deg,#c90d14,#f02128)}.action.reset{color:#ddd;background:linear-gradient(145deg,#19191c,#101012);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.action-icon{font-size:20px;line-height:1}
.fov{margin-top:27px}.fov-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:17px;font-weight:700}.fov-value{color:var(--red);font-size:18px;font-weight:900;text-shadow:0 0 8px rgba(255,0,0,.45)}
input[type=range]{width:100%;height:6px;appearance:none;-webkit-appearance:none;border-radius:999px;background:#242428;outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:23px;height:23px;border-radius:50%;border:0;background:var(--red);box-shadow:0 0 7px rgba(255,0,0,.8),0 0 16px rgba(255,0,0,.25)}
input[type=range]::-moz-range-thumb{width:23px;height:23px;border:0;border-radius:50%;background:var(--red);box-shadow:0 0 7px rgba(255,0,0,.8)}
.scale{display:flex;justify-content:space-between;margin-top:8px;color:rgba(255,255,255,.3);font-size:10px;font-weight:600}
.status{min-height:20px;display:flex;align-items:center;margin-top:19px;color:rgba(255,255,255,.5);font-size:12px}.dot{width:6px;height:6px;margin-right:8px;border-radius:50%;background:#606060}.dot.active{background:var(--red);box-shadow:0 0 8px var(--red)}
.version{margin:20px 0 0;color:#a5161d;text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;text-shadow:0 0 8px rgba(255,0,0,.3)}
@media(max-width:420px){.content{width:calc(100% - 28px);padding-top:35px;padding-bottom:30px}.brand{margin-bottom:24px}.logo{width:43px;height:43px}.brand h1{font-size:28px}.panel{padding:22px 18px 22px;border-radius:24px}.power{min-height:70px}.action{min-height:61px;font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Tema visual SensiAura: blanco y negro */
